<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAERO | Atmosphere Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 20%,rgba(230,215,176,.14),transparent 28%),
    linear-gradient(135deg,#07111d,#18314a 55%,#384b61);
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  overflow:hidden;
}

.intro-screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#07111d,#101d2c 60%,#25384f);
  z-index:10;
  animation:introFade 2.4s ease forwards;
}

.intro-logo{
  font-family:"Oswald",Arial,sans-serif;
  font-size:48px;
  letter-spacing:8px;
  color:#e6d7b0;
  opacity:0;
  transform:translateY(12px);
  animation:logoIn 1.4s ease forwards;
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 6%;
  opacity:0;
  animation:pageIn 1s ease forwards;
  animation-delay:2s;
}

.card{
  width:100%;
  max-width:520px;
  background:rgba(8,18,30,.82);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  padding:36px 28px;
  box-shadow:0 24px 80px rgba(0,0,0,.35);
}

.logo{
  font-family:"Oswald",Arial,sans-serif;
  font-size:42px;
  letter-spacing:6px;
  margin-bottom:10px;
}

.kicker{
  color:#e6d7b0;
  font-size:12px;
  letter-spacing:1px;
  margin-bottom:28px;
}

h1{
  font-family:"Oswald",Arial,sans-serif;
  font-size:38px;
  line-height:115%;
  margin-bottom:14px;
}

p{
  color:rgba(255,255,255,.68);
  font-size:15px;
  line-height:25px;
  margin-bottom:28px;
}

.btn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border-radius:15px;
  padding:18px 20px;
  margin-top:14px;
  font-size:15px;
  transition:.25s ease;
}

.btn:active{
  transform:scale(.98);
}

.primary{
  background:#e6d7b0;
  color:#0b1620;
  font-weight:600;
}

.secondary{
  background:rgba(255,255,255,.08);
  color:white;
  border:1px solid rgba(255,255,255,.12);
}

.note{
  margin-top:24px;
  font-size:13px;
  color:rgba(255,255,255,.45);
  line-height:21px;
}

@keyframes logoIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes introFade{
  0%{opacity:1}
  70%{opacity:1}
  100%{
    opacity:0;
    visibility:hidden;
  }
}

@keyframes pageIn{
  to{opacity:1}
}
</style>
</head>

<body>

<div class="intro-screen">
  <div class="intro-logo">VAERO</div>
</div>

<div class="wrap">
  <div class="card">
    <div class="logo">VAERO</div>
    <div class="kicker">ATMOSPHERE HUB</div>

    <h1>Atmosfer devam ediyor.</h1>

    <p>
      Koku yenileme, özel seçenekler ve VAERO dünyası için devam et.
    </p>

    <a class="btn primary" href="#" onclick="softAction('Koku yenileme sayfası yakında eklenecek.'); return false;">
      Atmosferimi yenile
    </a>

    <a class="btn secondary" href="#" onclick="softAction('Instagram sayfası yakında eklenecek.'); return false;">
      VAERO’yu keşfet
    </a>

    <div class="note">
      QR kod kalıcıdır. Bağlantılar zamanla güncellenebilir.
    </div>
  </div>
</div>

<script>
function softAction(message){
  if(navigator.vibrate){
    navigator.vibrate(18);
  }
  alert(message);
}
</script>

</body>
</html>
