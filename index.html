<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAERO | Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#07111d,#18314a 55%,#384b61);
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 6%;
}

.card{
  width:100%;
  max-width:520px;
  background:rgba(8,18,30,.82);
  border:1px solid rgba(255,255,255,.12);
  border-radius:26px;
  padding:36px 28px;
  box-shadow:0 24px 80px rgba(0,0,0,.35);
}

.logo{
  font-family:"Oswald",Arial,sans-serif;
  font-size:42px;
  letter-spacing:6px;
  margin-bottom:12px;
}

.kicker{
  color:#e6d7b0;
  font-size:12px;
  letter-spacing:1px;
  margin-bottom:28px;
}

h1{
  font-family:"Oswald",Arial,sans-serif;
  font-size:38px;
  line-height:115%;
  margin-bottom:14px;
}

p{
  color:rgba(255,255,255,.68);
  font-size:15px;
  line-height:25px;
  margin-bottom:28px;
}

.btn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border-radius:14px;
  padding:17px 20px;
  margin-top:14px;
  font-size:15px;
}

.primary{
  background:#e6d7b0;
  color:#0b1620;
  font-weight:600;
}

.secondary{
  background:rgba(255,255,255,.08);
  color:white;
  border:1px solid rgba(255,255,255,.12);
}

.note{
  margin-top:24px;
  font-size:13px;
  color:rgba(255,255,255,.45);
  line-height:21px;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">
    <div class="logo">VAERO</div>
    <div class="kicker">ATMOSPHERE HUB</div>

    <h1>VAERO devam eder.</h1>

    <p>
      Atmosferini yenilemek, yeni koku seçeneklerini görmek
      veya VAERO dünyasını takip etmek için seçim yap.
    </p>

    <a class="btn primary" href="#" onclick="alert('Koku yenileme sayfası yakında eklenecek.'); return false;">
  Atmosferimi yenile
</a>

    <a class="btn secondary" href="#" onclick="alert('Instagram sayfası yakında eklenecek.'); return false;">
  VAERO’yu Instagram’da keşfet
</a>

    <div class="note">
      Koku yenileme ve özel fırsatlar WhatsApp üzerinden netleştirilir.
    </div>
  </div>
</div>

</body>
</html>
